name: Bug report
description: Report a reproducible gameplay, rendering, data, or compatibility problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I removed secrets, private logs, and unlicensed assets.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Use...\n3. Observe..."
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: Commit hash, branch, or JAR version
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      placeholder: OS, Java, Minecraft, Fabric Loader, GPU if visual
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs and media
      description: Attach a relevant log excerpt, screenshot, or short recording. Do not paste secrets.
